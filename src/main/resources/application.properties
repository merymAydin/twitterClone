spring.application.name=twitter_challenge
server.port=8080

# No credentials are committed. Supply DB_PASSWORD (and optionally DB_URL/DB_USERNAME) locally.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema. Hibernate validates it instead of silently mutating production tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

stripe.secret-key=${STRIPE_SECRET_KEY}
# Public key used by Stripe.js. It is safe to expose to the browser; the secret key is not.
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.premium-price-id=${STRIPE_PREMIUM_PRICE_ID}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

server.error.include-message=never
